# Singularity 1.0. Native Omarchy surfaces, with restrained emerald controls.
[bar]
background       = "#050b08"
background-alpha = 1.0
text             = "#c9ddce"
active           = "#ec8181"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
[hyprland]
active-border            = "#59d98b"
active-border-foreground = "#c9ddce"
[controls]
normal-color        = "#c9ddce"
normal-fill-alpha   = 0.04
normal-border       = "#c9ddce"
normal-border-width = 1
normal-border-alpha = 0.22
hover-cursor-color        = "#59d98b"
hover-cursor-fill-alpha   = 0.08
hover-cursor-border       = "#59d98b"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25
focus-color        = "#59d98b"
focus-fill-alpha   = 0.08
focus-border       = "#59d98b"
focus-border-width = 1
focus-border-alpha = 0.25
selected-color        = "#59d98b"
selected-fill-alpha   = 0.18
selected-border       = "#59d98b"
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35
[spacing]
scale = 1.0
scale-with-font = true
[font]
base-size = 12
[popups]
background       = "#050b08"
background-alpha = 1.0
text             = "#c9ddce"
border           = "hyprland.active-border"
border-alpha     = 1.0
[tooltip]
background       = "#050b08"
background-alpha = 0.97
text             = "#c9ddce"
border           = "hyprland.active-border-foreground"
border-alpha     = 1.0
[notifications]
background       = "#050b08"
background-alpha = 1.0
text             = "#c9ddce"
border           = "hyprland.active-border"
border-alpha     = 1.0
countdown        = "#59d98b"
[launcher]
background                = "#050b08"
background-alpha          = 0.95
text                      = "#c9ddce"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#050b08"
scrim-alpha               = 0.5
selected-background       = "#c9ddce"
selected-background-alpha = 0.08
selected-text             = "#59d98b"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25
[menu]
background                = "#050b08"
background-alpha          = 1.0
text                      = "#c9ddce"
border                    = "hyprland.active-border-foreground"
border-alpha              = 1.0
scrim                     = "#050b08"
scrim-alpha               = 0.5
selected-background       = "#c9ddce"
selected-background-alpha = 0.08
selected-text             = "#59d98b"
selected-border           = "hyprland.active-border-foreground"
selected-border-alpha     = 0.25
[polkit]
background       = "#050b08"
background-alpha = 1.0
text             = "#c9ddce"
text-error       = "#ec8181"
border           = "hyprland.active-border"
border-error     = "#ec8181"
border-alpha     = 1.0
scrim            = "#050b08"
scrim-alpha      = 0.5
accent           = "#59d98b"
[lock]
background       = "#050b08"
background-alpha = 0.8
text             = "#c9ddce"
placeholder      = "#86968b"
text-error       = "#ec8181"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#ec8181"
border-alpha     = 1.0
selection        = "#59d98b"
selection-alpha  = 0.45
[image-picker]
scrim                   = "#050b08"
scrim-alpha             = 0.5
text                    = "#c9ddce"
selected-border         = "#59d98b"
selected-border-alpha   = 1.0
unselected-border       = "#59d98b"
unselected-border-alpha = 0.28
