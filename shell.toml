# Singularity 1.0. Native Omarchy surfaces, with restrained emerald controls.
[bar]
clock-text       = "#b4a0d2"
clock-shadow     = "#48385a"
workspace-active = "#b4a0d2"
font-family      = "F5000"
background       = "#050b08"
background-alpha = 1.0
text             = "#59d98b"
active           = "#ec8181"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28
[hyprland]
active-border            = "#59d98b"
active-border-foreground = "#c9ddce"
[controls]
normal-color             = "#b8c9d9"
normal-fill-alpha   = 0.04
normal-border            = "#86b3d1"
normal-border-width = 1
normal-border-alpha      = 0.28
hover-cursor-color       = "#86b3d1"
hover-cursor-fill-alpha  = 0.12
hover-cursor-border      = "#86b3d1"
hover-cursor-border-width = 1
hover-cursor-border-alpha= 0.55
focus-color              = "#b4a0d2"
focus-fill-alpha         = 0.12
focus-border             = "#b4a0d2"
focus-border-width = 1
focus-border-alpha       = 0.65
selected-color           = "#dca276"
selected-fill-alpha      = 0.17
selected-border          = "#dca276"
selected-border-width    = 1
selected-border-alpha    = 0.5
pressed-fill-alpha   = 0.22
selection-fill-alpha = 0.35
[spacing]
scale = 1.0
scale-with-font = true
[font]
base-size = 12
[popups]
green                    = "#59d98b"
background               = "#08110f"
background-alpha         = 0.90
text                     = "#d4dce7"
border                   = "#b4a0d2"
border-alpha             = 0.65
title                    = "#b4a0d2"
active                   = "#dca276"
description              = "#86b3d1"
inactive                 = "#819bb6"
[tooltip]
background               = "#08110f"
background-alpha         = 0.90
text                     = "#b8c9d9"
border                   = "#86b3d1"
border-alpha             = 0.45
[notifications]
background       = "#050b08"
background-alpha         = 0.90
text             = "#c9ddce"
border           = "hyprland.active-border"
border-alpha     = 1.0
countdown        = "#59d98b"
[launcher]
background               = "#08110f"
background-alpha         = 0.90
text                     = "#d4dce7"
border                   = "#b4a0d2"
border-alpha             = 0.65
scrim                     = "#050b08"
scrim-alpha               = 0.5
selected-background      = "#86b3d1"
selected-background-alpha= 0.14
selected-text            = "#dca276"
selected-border          = "#86b3d1"
selected-border-alpha    = 0.45
[menu]
background               = "#08110f"
background-alpha         = 0.90
text                     = "#d4dce7"
border                   = "#b4a0d2"
border-alpha             = 0.65
scrim                     = "#050b08"
scrim-alpha               = 0.5
selected-background      = "#86b3d1"
selected-background-alpha= 0.14
selected-text            = "#dca276"
selected-border          = "#86b3d1"
selected-border-alpha    = 0.45
[polkit]
background       = "#050b08"
background-alpha = 1.0
text             = "#c9ddce"
text-error       = "#ec8181"
border           = "hyprland.active-border"
border-error     = "#ec8181"
border-alpha     = 1.0
scrim            = "#050b08"
scrim-alpha      = 0.5
accent           = "#59d98b"
[lock]
background       = "#050b08"
background-alpha = 0.8
text             = "#c9ddce"
placeholder      = "#86968b"
text-error       = "#ec8181"
border           = "hyprland.active-border"
border-active    = "hyprland.active-border"
border-error     = "#ec8181"
border-alpha     = 1.0
selection        = "#59d98b"
selection-alpha  = 0.45
[image-picker]
scrim                   = "#050b08"
scrim-alpha             = 0.5
text                    = "#c9ddce"
selected-border         = "#59d98b"
selected-border-alpha   = 1.0
unselected-border       = "#59d98b"
unselected-border-alpha = 0.28
